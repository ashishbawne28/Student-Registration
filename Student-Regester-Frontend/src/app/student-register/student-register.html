
<div class="registration-page">

  <div class="registration-card">

    <!-- Header -->
    <div class="card-header">
      <div class="icon">🎓</div>
      <h2>Student Registration</h2>
      <p>Start your learning journey with us</p>
    </div>

    <!-- Registration Fields -->
    <div class="card-body">

      <div class="registration-grid">

        <!-- Full Name -->
        <div class="input-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            class="custom-input"
            [(ngModel)]="student.fullName"
            #fullName="ngModel"
            required
            minlength="3"
            maxlength="50"
            pattern="[a-zA-Z ]+"
            placeholder="Enter full name"
          />

          <small class="text-danger"
            *ngIf="fullName.invalid && (fullName.touched || submitted)">
            Please enter a valid name (3-50 letters).
          </small>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            class="custom-input"
            [(ngModel)]="student.email"
            #email="ngModel"
            required
            email
            placeholder="Enter email address"
          />

          <small class="text-danger"
            *ngIf="email.invalid && (email.touched || submitted)">
            Please enter a valid email address.
          </small>
        </div>

        <!-- Mobile -->
        <div class="input-group">
          <label for="mobile">Mobile Number</label>

          <input
            type="tel"
            id="mobile"
            name="mobile"
            class="custom-input"
            [(ngModel)]="student.mobile"
            #mobile="ngModel"
            required
            maxlength="10"
            pattern="[6-9][0-9]{9}"
            placeholder="Enter mobile number"
          />

          <small class="text-danger"
            *ngIf="mobile.invalid && (mobile.touched || submitted)">
            Enter a valid 10-digit mobile number.
          </small>
        </div>

        <!-- Course -->
        <div class="input-group">
          <label for="course">Course</label>

          <select
            id="course"
            name="course"
            class="custom-input"
            [(ngModel)]="student.course"
            #course="ngModel"
            required
          >
            <option value="" disabled>Select your course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="B.E">B.E</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="B.Sc">B.Sc</option>
            <option value="M.Sc">M.Sc</option>
            <option value="MBA">MBA</option>
          </select>

          <small class="text-danger"
            *ngIf="course.invalid && (course.touched || submitted)">
            Please select a course.
          </small>
        </div>

        <!-- City -->
        <div class="input-group">
          <label for="city">City</label>

          <input
            type="text"
            id="city"
            name="city"
            class="custom-input"
            [(ngModel)]="student.city"
            #city="ngModel"
            required
            pattern="[a-zA-Z ]+"
            placeholder="Enter city"
          />

          <small class="text-danger"
            *ngIf="city.invalid && (city.touched || submitted)">
            Please enter a valid city name.
          </small>
        </div>

        <!-- College -->
        <div class="input-group">
          <label for="collegeName">College Name</label>

          <input
            type="text"
            id="collegeName"
            name="collegeName"
            class="custom-input"
            [(ngModel)]="student.collegeName"
            #collegeName="ngModel"
            required
            minlength="3"
            placeholder="Enter college name"
          />

          <small class="text-danger"
            *ngIf="collegeName.invalid && (collegeName.touched || submitted)">
            College name must contain at least 3 characters.
          </small>
        </div>

      </div>

      <!-- Register Button -->
      <button
        type="button"
        class="register-btn"
        (click)="saveStudent()"
      >
        Register Now →
      </button>

    </div>
  </div>
</div>
